<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tunnelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="#0f172a"/>
  
  <!-- Tunnel arcs (concentric, suggesting depth/tunnel) -->
  <path d="M 128 356 A 140 140 0 0 1 128 156" stroke="url(#tunnelGrad)" stroke-width="20" fill="none" stroke-linecap="round"/>
  <path d="M 168 340 A 95 95 0 0 1 168 172" stroke="url(#tunnelGrad)" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 208 324 A 50 50 0 0 1 208 188" stroke="url(#tunnelGrad)" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Phone (right side) -->
  <rect x="280" y="146" width="96" height="220" rx="18" fill="#1e293b" stroke="#6366f1" stroke-width="4"/>
  <rect x="290" y="176" width="76" height="158" rx="4" fill="#334155"/>
  <circle cx="328" cy="346" r="7" fill="#6366f1"/>
  
  <!-- Connection dots (tunnel → phone) -->
  <circle cx="240" cy="256" r="8" fill="#6366f1"/>
  <circle cx="258" cy="240" r="6" fill="#8b5cf6"/>
  <circle cx="254" cy="272" r="5" fill="#a78bfa"/>
  
  <!-- Signal waves from phone -->
  <path d="M 396 200 A 40 40 0 0 1 396 280" stroke="#a78bfa" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 416 180 A 70 70 0 0 1 416 320" stroke="#8b5cf6" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>
